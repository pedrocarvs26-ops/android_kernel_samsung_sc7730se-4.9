# Builds the SC7730SE port for both tablets and uploads zImage + DTBs.
#
# The job runs inside an ubuntu:20.04 container on purpose: its default cross
# toolchain is GCC 9, the newest GCC that still builds Linux 4.9 without the
# -fno-common link errors introduced by GCC 10.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        board: [gtelwifi, gtel3g]
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio device-tree-compiler \
            flex gcc-arm-linux-gnueabihf git kmod libc6-dev-armhf-cross \
            libelf-dev libssl-dev lz4

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zImage and DTBs
        run: bash ./port/build.sh
        env:
          BOARD: ${{ matrix.board }}
          ARCH: arm
          CROSS_COMPILE: arm-linux-gnueabihf-

      # The kernel builds freestanding, but memdump is ordinary userspace code:
      # it needs the armhf libc headers and libc.a from libc6-dev-armhf-cross.
      # Without that package the Debian cross compiler ends its include search
      # in the host /usr/include and dies on "sys/cdefs.h: No such file or
      # directory". continue-on-error keeps a problem with a debug helper from
      # throwing away an otherwise good kernel build.
      - name: Build the memdump helper
        continue-on-error: true
        run: |
          arm-linux-gnueabihf-gcc -static -O2 -Wall \
            -o out/memdump tools/memdump.c
          arm-linux-gnueabihf-strip out/memdump
          ls -l out/memdump

      # A kernel built before the RAM console existed is indistinguishable
      # from a kernel that dies in the first instruction: both leave the
      # ramoops region full of zeros. Fail here instead, and stamp every
      # artifact with the commit it came from so a downloaded zip can always be
      # traced back to a tree.
      - name: Verify the debug plumbing and stamp the build
        run: |
          dtb="out/sc7730se-${{ matrix.board }}.dtb"
          grep -aq ramoops "$dtb" \
            || { echo "::error::$dtb has no ramoops node"; exit 1; }
          grep -q '^CONFIG_PSTORE_RAM=y' .config \
            || { echo "::error::CONFIG_PSTORE_RAM=y missing from .config"; exit 1; }
          {
            echo "commit : $GITHUB_SHA"
            echo "board  : ${{ matrix.board }}"
            echo "run    : #$GITHUB_RUN_NUMBER"
            echo "built  : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            grep -E '^CONFIG_(PSTORE|PSTORE_RAM|PSTORE_CONSOLE|SMP|ARM_APPENDED_DTB)=' .config || true
          } > out/BUILD-INFO.txt
          cat out/BUILD-INFO.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.board }}
          path: |
            out/zImage
            out/zImage-dtb
            out/*.dtb
            out/memdump
            out/BUILD-INFO.txt
          if-no-files-found: error
