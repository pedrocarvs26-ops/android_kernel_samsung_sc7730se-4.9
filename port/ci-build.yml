# GitHub Actions workflow for this port.
#
# It lives here instead of .github/workflows/ because a token without the
# "workflow" scope cannot push files under .github/workflows. To enable CI,
# copy it into place and push from your own account:
#
#     mkdir -p .github/workflows
#     cp port/ci-build.yml .github/workflows/build.yml
#     git add .github/workflows/build.yml
#     git commit -m "ci: build zImage and DTBs"
#     git push
#
# The job runs inside an ubuntu:20.04 container on purpose: its default cross
# toolchain is GCC 9, the newest GCC that still builds Linux 4.9 without the
# -fno-common link errors introduced by GCC 10.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        board: [gtelwifi, gtel3g]
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio device-tree-compiler \
            flex gcc-arm-linux-gnueabihf git kmod libelf-dev libssl-dev lz4

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zImage and DTBs
        run: bash ./port/build.sh
        env:
          BOARD: ${{ matrix.board }}
          ARCH: arm
          CROSS_COMPILE: arm-linux-gnueabihf-

      - name: Build the memdump helper
        run: |
          arm-linux-gnueabihf-gcc -static -O2 -Wall -o out/memdump tools/memdump.c
          arm-linux-gnueabihf-strip out/memdump
          ls -l out/memdump

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.board }}
          path: |
            out/zImage
            out/zImage-dtb
            out/*.dtb
            out/memdump
          if-no-files-found: error
